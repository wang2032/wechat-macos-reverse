name: 使用问题
description: 怎么用、能不能做某件事、数据结构疑问
labels: ["question"]
body:
  - type: textarea
    id: q
    attributes:
      label: 你的问题
      description: 说清楚你手上有什么（版本、已经拿到密钥没有），比"跑不起来"有用得多
    validations:
      required: true
  - type: checkboxes
    id: ack
    attributes:
      label: 确认
      options:
        - label: 我只处理自己机器上、自己登录的账号
          required: true
        - label: 我没有把密钥或聊天内容贴进这个 issue
          required: true
